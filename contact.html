<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Taste of Africa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Taste of Africa</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="regions.html">Regions</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact Us</h1>

    <section class="contact-section">
      <form id="contact-form">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Choose your country</option>
          <option>Rwanda</option>
          <option>Nigeria</option>
          <option>Ghana</option>
          <option>Ethiopia</option>
          <option>Morocco</option>
          <option>Kenya</option>
          <option>Other</option>
        </select>

        <label for="dish">Favorite African dish</label>
        <input type="text" id="dish" name="dish" list="dish-list">
        <datalist id="dish-list">
          <option value="Jollof Rice">
          <option value="Injera">
          <option value="Tagine">
          <option value="Isombe">
          <option value="Bunny Chow">
        </datalist>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <p id="message-error" class="error"></p>

        <button type="submit">Send Message</button>
      </form>

      <p id="confirmation" class="confirmation hidden"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Taste of Africa</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
